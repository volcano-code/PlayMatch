name: playmatch

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playmatch
      POSTGRES_USER: playmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmatch -d playmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://playmatch:${POSTGRES_PASSWORD:-local-development-only}@db:5432/playmatch
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-8}
      SEMANTIC_MIN_SCORE: ${SEMANTIC_MIN_SCORE:-0.65}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_SYNC_ENABLED: ${STEAM_SYNC_ENABLED:-false}
      STEAM_SYNC_INTERVAL_SECONDS: ${STEAM_SYNC_INTERVAL_SECONDS:-600}
      STEAM_FULL_SYNC_SECONDS: ${STEAM_FULL_SYNC_SECONDS:-604800}
      STEAM_SYNC_DAILY_REQUESTS: ${STEAM_SYNC_DAILY_REQUESTS:-1000}
      STEAM_SYNC_PAGE_SIZE: ${STEAM_SYNC_PAGE_SIZE:-5000}
      RUN_WORKERS: 2
      RUN_EXECUTION_MODE: external
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-15}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-90}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "playmatch.worker"]
    environment:
      <<: *api-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "playmatch.worker", "--health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 10s
    restart: unless-stopped

  catalog-sync:
    profiles: ["catalog-sync"]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "playmatch.steam_worker"]
    environment:
      <<: *api-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "playmatch.steam_worker", "--health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

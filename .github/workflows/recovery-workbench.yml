name: One-shot recovery workbench
on:
  push:
    branches: ['feat/v02-retrieval-recovery']
    paths: ['scripts/recovery_assemble.py', '.github/workflows/recovery-workbench.yml']
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playmatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: catalog_recovery
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U playmatch -d catalog_recovery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - name: Assemble and format candidate
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          python scripts/recovery_assemble.py
          sed -i 's/str(database.engine.url)/database.engine.url.render_as_string(hide_password=False)/' services/api/tests/test_catalog_v02.py
          uv run ruff check --fix .
          uv run ruff format .
          npm --prefix apps/web ci
          cd apps/web && npx --no-install prettier --write lib/types.ts
      - name: Validate all Python tests
        run: uv run pytest -q --junitxml="$RUNNER_TEMP/recovery-evidence/python.xml"
      - name: Validate PostgreSQL import semantics
        env:
          CATALOG_TEST_DATABASE_URL: postgresql+psycopg://playmatch:ci-only-password@127.0.0.1:5432/catalog_recovery
        run: uv run pytest services/api/tests/test_catalog_v02.py -q --junitxml="$RUNNER_TEMP/recovery-evidence/postgres.xml"
      - name: Frozen lexical evaluations and contract
        run: |
          uv run python scripts/evaluate_recommendations.py --mode keyword_baseline --check --output "$RUNNER_TEMP/recovery-evidence/keyword.json"
          uv run python scripts/evaluate_recommendations.py --mode bm25 --check --output "$RUNNER_TEMP/recovery-evidence/bm25.json"
          uv run python scripts/check_openapi.py
      - name: Frontend checks
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - name: Create candidate Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'volcano-code/PlayMatch'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def post(endpoint, payload):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          subprocess.run(['git', 'add', '-A'], check=True)
          entries = []
          changed = git('diff', '--cached', '--name-status', '--no-renames').splitlines()
          for row in changed:
              status, path = row.split('\t', 1)
              assert not path.startswith(('.env/', '.state/', 'node_modules/'))
              assert not path.endswith(('.db', '.sqlite', '.pem'))
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  blob = post('/git/blobs', {'content': base64.b64encode(Path(path).read_bytes()).decode(), 'encoding': 'base64'})
                  mode = git('ls-files', '-s', '--', path).split()[0]
                  entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          parent = git('rev-parse', 'HEAD')
          tree = post('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == git('write-tree')
          commit = post('/git/commits', {'message': 'feat: add bounded hybrid retrieval and atomic reviewed catalog imports',
              'tree': tree['sha'], 'parents': [parent]})
          output = {'candidate_sha': commit['sha'], 'tree_sha': tree['sha'], 'parent_sha': parent}
          directory = Path(os.environ['RUNNER_TEMP']) / 'recovery-evidence'
          (directory / 'candidate.json').write_text(json.dumps(output, indent=2))
          (directory / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          subprocess.run(['git', 'archive', '--format=zip', git('write-tree'), '-o', str(directory / 'source.zip')], check=True)
          print('CANDIDATE ' + json.dumps(output))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recovery-validation-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-evidence/
          retention-days: 7

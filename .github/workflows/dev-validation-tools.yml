name: Recovery validation tools
on:
  push:
    branches: ['feat/v02-retrieval-recovery']
    paths: ['.github/workflows/dev-validation-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Download pinned validation dependencies only
        run: |
          python -m pip install uv==0.12.23
          mkdir -p "$RUNNER_TEMP/tools/wheels"
          uv export --frozen --extra dev --no-emit-project -o "$RUNNER_TEMP/tools/requirements.txt"
          python -m pip download --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/tools/requirements.txt" -d "$RUNNER_TEMP/tools/wheels"
          cd "$RUNNER_TEMP/tools"
          npm pack prettier@3.9.10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-validation-tools
          path: ${{ runner.temp }}/tools/
          retention-days: 1

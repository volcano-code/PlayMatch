name: V07 Steam directory and durable synchronization verification
on:
  push:
    branches: ['workbench/v07-validation']
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playmatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: steam_directory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U playmatch -d steam_directory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Restore exact locally tested candidate
        run: |
          python - <<'PY'
          import hashlib, lzma, os, subprocess
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'v07-evidence'
          evidence.mkdir()
          patch = lzma.decompress(b''.join(Path(f'.handoff/v07/{i:02}.part').read_bytes() for i in range(5)))
          assert hashlib.sha256(patch).hexdigest() == '14de162b4b7e868a4dd6e6cbe991173bd8723bd957aa3e3fd477791efe686137'
          path = evidence / 'candidate.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'reset', '--hard', '4f61b364fe9bd11282a407449137524d8edecef6'], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == '7af9521e5a235007f232ac63d830a215cf078ac1', tree
          print('Verified candidate tree', tree)
          PY
      - run: python -m pip install -q uv==0.12.23
      - run: uv sync --frozen --extra dev
      - name: All Python tests and unchanged development evaluations
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q --junitxml="$RUNNER_TEMP/v07-evidence/python.xml" | tee "$RUNNER_TEMP/v07-evidence/python.log"
          uv run python scripts/evaluate_recommendations.py --check --output "$RUNNER_TEMP/v07-evidence/keyword.json"
          uv run python scripts/evaluate_recommendations.py --mode bm25 --check --output "$RUNNER_TEMP/v07-evidence/bm25.json"
          uv run python scripts/benchmark_catalog.py evaluate --check --output "$RUNNER_TEMP/v07-evidence/catalog-v06.json"
          cmp "$RUNNER_TEMP/v07-evidence/catalog-v06.json" evals/catalog-v06-results.json
          uv run python scripts/check_openapi.py
      - name: PostgreSQL Steam sync recovery, ownership and migrations
        env:
          STEAM_TEST_DATABASE_URL: postgresql+psycopg://playmatch:ci-only-password@127.0.0.1:5432/steam_directory_test
          PLAYMATCH_ALLOW_DISPOSABLE_DB: 'yes'
        run: uv run pytest services/api/tests/test_steam_sync_v07.py -q --junitxml="$RUNNER_TEMP/v07-evidence/steam-postgres.xml"
      - name: 100k synthetic identities in PostgreSQL, restart and SQL queries (not live coverage)
        env:
          STEAM_BENCH_DATABASE_URL: postgresql+psycopg://playmatch:ci-only-password@127.0.0.1:5432/steam_directory_test
          PLAYMATCH_ALLOW_DISPOSABLE_DB: 'yes'
        run: uv run python scripts/benchmark_steam_directory.py --output "$RUNNER_TEMP/v07-evidence/steam-scale.json"
      - name: Frontend checks and production build
        run: |
          set -euo pipefail
          npm --prefix apps/web ci
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run format:check
          npm --prefix apps/web test | tee "$RUNNER_TEMP/v07-evidence/web-unit.log"
          npm --prefix apps/web run build
      - name: Browser regression with explicitly labeled directory fixtures
        run: |
          set -euo pipefail
          npm --prefix tests/e2e ci
          npx --prefix tests/e2e playwright install --with-deps chromium > "$RUNNER_TEMP/v07-evidence/browser-install.log" 2>&1
          npm --prefix tests/e2e test | tee "$RUNNER_TEMP/v07-evidence/browser.log"
      - name: Export exact tested source and Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'volcano-code/PlayMatch'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          tree = git('write-tree')
          assert tree == '7af9521e5a235007f232ac63d830a215cf078ac1'
          directory = Path(os.environ['RUNNER_TEMP']) / 'v07-evidence'
          subprocess.run(['git', 'archive', '--format=zip', tree, '-o', str(directory / 'source.zip')], check=True)
          (directory / 'source.sha256').write_text(hashlib.sha256((directory / 'source.zip').read_bytes()).hexdigest())
          entries = []
          for line in git('diff', '--cached', '--name-status', '--no-renames').splitlines():
              status, path = line.split('\t', 1)
              assert not path.endswith(('.env', '.db', '.sqlite', '.pem'))
              assert not path.startswith(('.state/', '.handoff/', 'node_modules/'))
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = git('ls-files', '-s', '--', path).split()[0]
              content = Path(path).read_bytes()
              assert mode in ('100644', '100755') and len(content) < 300000
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == git('hash-object', path)
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          result = {'tree_sha': tree, 'parent_sha': git('rev-parse', 'HEAD'),
                    'base_tree_sha': git('rev-parse', 'HEAD^{tree}'), 'entries': entries}
          (directory / 'candidate.json').write_text(json.dumps(result, indent=2))
          print('V07_MANIFEST ' + json.dumps(result))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v07-core-${{ github.sha }}
          path: ${{ runner.temp }}/v07-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: v07-browser-failure-${{ github.sha }}
          path: tests/e2e/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore exact candidate
        run: |
          python3 - <<'PY'
          import hashlib, lzma, os, subprocess
          from pathlib import Path
          patch = lzma.decompress(b''.join(Path(f'.handoff/v07/{i:02}.part').read_bytes() for i in range(5)))
          assert hashlib.sha256(patch).hexdigest() == '14de162b4b7e868a4dd6e6cbe991173bd8723bd957aa3e3fd477791efe686137'
          path = Path(os.environ['RUNNER_TEMP']) / 'candidate.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'reset', '--hard', '4f61b364fe9bd11282a407449137524d8edecef6'], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == '7af9521e5a235007f232ac63d830a215cf078ac1'
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Real recommendation to independent worker
        run: docker compose exec -T api python scripts/smoke_worker.py
      - name: Notification regression with synthetic prices
        run: docker compose exec -T -e PLAYMATCH_ALLOW_NOTIFICATION_FIXTURE=yes api python scripts/smoke_notifications.py
      - name: Synthetic Steam identity to SQL and HTTP without a live key
        run: docker compose exec -T -e PLAYMATCH_ALLOW_STEAM_FIXTURE=yes api python scripts/smoke_steam_directory.py
      - name: Diagnostics
        if: always()
        run: docker compose logs --tail 60
      - name: Stop ephemeral test containers
        if: always()
        run: docker compose down --volumes
